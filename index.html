<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokémon HeartGold Bingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #CC0000;
    --dark-red: #8B0000;
    --gold: #FFD700;
    --dark-gold: #B8860B;
    --cream: #FFF8E7;
    --dark: #0A0A1A;
    --shadow: #000;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    background-image:
      radial-gradient(ellipse at 20% 50%, #1a0a1a 0%, transparent 60%),
      radial-gradient(ellipse at 80% 50%, #0a0a2a 0%, transparent 60%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Press Start 2P', monospace;
    color: var(--cream);
    overflow: hidden;
    position: relative;
  }

  /* Animated pokeballs background */
  .bg-balls { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .bg-ball {
    position: absolute;
    border-radius: 50%;
    border: 3px solid rgba(255,215,0,0.06);
    animation: floatBall linear infinite;
  }

  @keyframes floatBall {
    from { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    to { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
  }

  .card {
    position: relative;
    z-index: 1;
    background: rgba(10,10,26,0.95);
    border: 3px solid var(--dark-gold);
    box-shadow: 0 0 0 1px rgba(255,215,0,0.1), 8px 8px 0 var(--shadow), 0 0 60px rgba(204,0,0,0.2);
    padding: 48px 40px;
    max-width: 460px;
    width: 90%;
    text-align: center;
    animation: cardIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: scale(0.8) translateY(30px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .pokeball-icon {
    width: 70px; height: 70px;
    margin: 0 auto 20px;
    position: relative;
    animation: spin 6s linear infinite;
  }

  .pokeball-icon svg { width: 100%; height: 100%; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .game-title {
    font-size: 10px;
    color: var(--gold);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 8px;
    opacity: 0.8;
  }

  h1 {
    font-size: clamp(20px, 5vw, 28px);
    color: var(--gold);
    text-shadow: 3px 3px 0 var(--dark-red), 6px 6px 0 rgba(0,0,0,0.5);
    line-height: 1.3;
    margin-bottom: 6px;
  }

  h1 span { color: #fff; text-shadow: 2px 2px 0 #003B8E, 4px 4px 0 rgba(0,0,0,0.5); }

  .subtitle {
    font-size: 7px;
    color: rgba(255,248,231,0.4);
    margin-bottom: 36px;
    letter-spacing: 1px;
  }

  .divider {
    height: 2px;
    background: linear-gradient(to right, transparent, var(--dark-gold), transparent);
    margin: 0 0 28px;
    opacity: 0.5;
  }

  label {
    display: block;
    font-size: 8px;
    color: var(--gold);
    margin-bottom: 10px;
    text-align: left;
    letter-spacing: 1px;
  }

  input[type="text"] {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 2px solid var(--dark-gold);
    color: var(--cream);
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    padding: 14px 16px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    text-align: center;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  input[type="text"]:focus {
    border-color: var(--gold);
    box-shadow: 0 0 20px rgba(255,215,0,0.15);
  }

  input[type="text"]::placeholder { color: rgba(255,248,231,0.2); font-size: 10px; letter-spacing: 1px; }

  .enter-btn {
    width: 100%;
    margin-top: 16px;
    background: var(--red);
    border: 3px solid var(--dark-gold);
    color: var(--gold);
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 4px 4px 0 var(--shadow);
    letter-spacing: 1px;
    position: relative;
    overflow: hidden;
  }

  .enter-btn:hover:not(:disabled) {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 var(--shadow);
    background: #DD0000;
  }

  .enter-btn:active:not(:disabled) {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 var(--shadow);
  }

  .enter-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .players-preview {
    margin-top: 28px;
    text-align: left;
  }

  .players-preview-title {
    font-size: 7px;
    color: rgba(255,248,231,0.4);
    margin-bottom: 10px;
    letter-spacing: 1px;
  }

  .player-pill {
    display: inline-block;
    background: rgba(255,215,0,0.08);
    border: 1px solid rgba(255,215,0,0.2);
    color: var(--gold);
    font-size: 8px;
    padding: 5px 10px;
    margin: 3px;
    font-family: 'VT323', monospace;
    font-size: 16px;
  }

  .no-players { font-size: 7px; color: rgba(255,255,255,0.2); font-family: 'VT323', monospace; font-size: 14px; }

  .error-msg {
    font-size: 7px;
    color: #ff6666;
    margin-top: 10px;
    display: none;
  }

  .nav-links {
    position: relative; z-index: 1;
    display: flex; gap: 20px;
    margin-top: 20px;
  }

  .nav-link {
    font-size: 7px;
    color: rgba(255,248,231,0.4);
    text-decoration: none;
    letter-spacing: 1px;
    transition: color 0.2s;
  }
  .nav-link:hover { color: var(--gold); }
</style>
</head>
<body>

<div class="bg-balls" id="bgBalls"></div>

<div class="card">
  <div class="pokeball-icon">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="48" fill="none" stroke="#FFD700" stroke-width="4"/>
      <path d="M2 50 Q50 50 98 50" stroke="#FFD700" stroke-width="4" fill="none"/>
      <path d="M2 50 A48 48 0 0 1 98 50" fill="#CC0000" opacity="0.3"/>
      <circle cx="50" cy="50" r="12" fill="#0A0A1A" stroke="#FFD700" stroke-width="4"/>
      <circle cx="50" cy="50" r="6" fill="#FFD700"/>
    </svg>
  </div>

  <p class="game-title">Pokémon HeartGold</p>
  <h1>BINGO<br><span>CHALLENGE</span></h1>
  <p class="subtitle">Temporada 2025 · 4 Jugadores</p>

  <div class="divider"></div>

  <label>¿CUÁL ES TU NOMBRE DE ENTRENADOR?</label>
  <input type="text" id="nicknameInput" maxlength="12" placeholder="ASH...">
  <p class="error-msg" id="errorMsg">⚠ Ese nombre ya está en uso</p>
  <button class="enter-btn" id="enterBtn" onclick="enterGame()">▶ EMPEZAR</button>

  <div class="players-preview">
    <p class="players-preview-title">ENTRENADORES ACTIVOS:</p>
    <div id="playersList"><span class="no-players">Nadie ha entrado aún...</span></div>
  </div>
</div>

<div class="nav-links">
  <a href="pages/ranking.html" class="nav-link">🏆 RANKING</a>
  <a href="pages/rules.html" class="nav-link">📋 REGLAS</a>
  <a href="pages/prizes.html" class="nav-link">🎁 PREMIOS</a>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBSOal28NySNl8WwIXXgE4rL0l4EsDVXl8",
    authDomain: "pkmn-heartgold.firebaseapp.com",
    projectId: "pkmn-heartgold",
    storageBucket: "pkmn-heartgold.firebasestorage.app",
    messagingSenderId: "100911488175",
    appId: "1:100911488175:web:7b9798872692ced629885a"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Live players list
  onSnapshot(collection(db, 'players'), (snap) => {
    const list = document.getElementById('playersList');
    if (snap.empty) {
      list.innerHTML = '<span class="no-players">Nadie ha entrado aún...</span>';
      return;
    }
    list.innerHTML = snap.docs.map(d =>
      `<span class="player-pill">${d.data().name}</span>`
    ).join('');
  });

  window.enterGame = async function() {
    const input = document.getElementById('nicknameInput');
    const name = input.value.trim().toUpperCase();
    const err = document.getElementById('errorMsg');
    const btn = document.getElementById('enterBtn');

    if (!name || name.length < 2) {
      err.textContent = '⚠ Ingresa al menos 2 caracteres';
      err.style.display = 'block'; return;
    }

    btn.disabled = true;
    btn.textContent = 'CARGANDO...';
    err.style.display = 'none';

    // Check if name exists
    const ref = doc(db, 'players', name);
    const snap = await getDoc(ref);

    if (!snap.exists()) {
      // New player — create
      await setDoc(ref, {
        name,
        marks: new Array(25).fill(false),
        joinedAt: new Date().toISOString()
      });
    }

    // Save session and redirect
    sessionStorage.setItem('player', name);
    window.location.href = 'pages/bingo.html';
  };

  // Spawn bg balls
  const container = document.getElementById('bgBalls');
  for (let i = 0; i < 12; i++) {
    const ball = document.createElement('div');
    const size = 40 + Math.random() * 120;
    ball.className = 'bg-ball';
    ball.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      animation-duration:${8+Math.random()*12}s;
      animation-delay:${-Math.random()*15}s;
    `;
    container.appendChild(ball);
  }

  document.getElementById('nicknameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.enterGame();
  });
</script>
</body>
</html>
